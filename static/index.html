<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Image Studio - 画像生成</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <h1>Image Studio</h1>
    <p class="lead">
      ComfyUIを使った画像生成専用サイトです。ゲーム本体とは完全に独立して動きます。
    </p>

    <form id="generate-form">
      <label>
        種類
        <select id="workflow_id" required></select>
      </label>
      <p id="workflow-description" class="hint"></p>

      <div id="reference-uploads"></div>

      <div id="character-picker" hidden>
        <label>
          保存済みキャラクターを使う(任意)
          <select id="character_select">
            <option value="">-- 使わない(新しい画像をアップロード) --</option>
          </select>
        </label>
      </div>

      <label>
        欲しい画像の説明 (プロンプト)
        <div class="prompt-row">
          <textarea id="prompt" rows="3" placeholder="例: 1girl, short brown hair, school uniform, smiling" required></textarea>
          <button type="button" id="expand-btn" hidden>AIで英語プロンプトに変換</button>
        </div>
      </label>

      <label>
        入れたくない要素 (ネガティブプロンプト・任意)
        <textarea id="negative" rows="2" placeholder="例: lowres, extra fingers, watermark"></textarea>
      </label>

      <label>
        シード値 (任意・同じ数字だと同じ絵になりやすい)
        <input id="seed" type="number" placeholder="空欄でランダム" />
      </label>

      <button type="submit" id="generate-btn">生成する (4枚)</button>
    </form>

    <div id="status"></div>

    <div id="result" hidden>
      <div id="result-grid"></div>
      <p class="hint">
        気に入った画像は「ダウンロード」で保存し、ゲームプロジェクトの
        <code>novel/assets/characters/</code> や <code>novel/assets/backgrounds/</code> に置いてください。
        キャラクター用の画像は「キャラクターとして保存」で、このサイトのライブラリにも登録できます
        (表情違いなどを後で作るときの参照元になります)。
      </p>
    </div>

    <section id="character-library">
      <h2>保存したキャラクター</h2>
      <div id="character-list"></div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
