<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Image Studio - 画像生成</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <h1>Image Studio</h1>
    <p class="lead">
      ComfyUIを使った画像生成専用サイトです。ゲーム本体とは完全に独立して動きます。
    </p>

    <form id="generate-form">
      <label>
        種類
        <select id="workflow_id" required></select>
      </label>

      <label>
        欲しい画像の説明 (プロンプト)
        <textarea id="prompt" rows="3" placeholder="例: 1girl, short brown hair, school uniform, smiling" required></textarea>
      </label>

      <label>
        入れたくない要素 (ネガティブプロンプト・任意)
        <textarea id="negative" rows="2" placeholder="例: lowres, extra fingers, watermark"></textarea>
      </label>

      <label>
        シード値 (任意・同じ数字だと同じ絵になりやすい)
        <input id="seed" type="number" placeholder="空欄でランダム" />
      </label>

      <button type="submit" id="generate-btn">生成する</button>
    </form>

    <div id="status"></div>

    <div id="result" hidden>
      <img id="result-image" alt="生成結果" />
      <div class="actions">
        <a id="download-link" download="generated.png">この画像をダウンロード</a>
      </div>
      <p class="hint">
        ダウンロードした画像を、ゲームプロジェクトの <code>novel/assets/characters/</code> または
        <code>novel/assets/backgrounds/</code> に置くとゲームで使えます。
      </p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
